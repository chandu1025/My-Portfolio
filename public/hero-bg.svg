<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.55" stop-color="#0f0b24"/>
      <stop offset="1" stop-color="#190a1f"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#dd0031" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dd0031" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.15" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.6" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1920" height="1080" fill="url(#gridFade)"/></mask>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glowRed)"/>
  <rect width="1920" height="1080" fill="url(#glowViolet)"/>
  <rect width="1920" height="1080" fill="url(#glowCyan)"/>

  <!-- floating blurred orbs -->
  <circle cx="1560" cy="260" r="170" fill="#dd0031" opacity="0.28" filter="url(#blur)"/>
  <circle cx="330" cy="820" r="210" fill="#7c3aed" opacity="0.30" filter="url(#blur)"/>
  <circle cx="1100" cy="980" r="130" fill="#22d3ee" opacity="0.16" filter="url(#blur)"/>

  <!-- grid -->
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- code brackets: < / > -->
  <g fill="none" stroke="url(#stroke)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M1490 330 L1370 450 L1490 570"/>
    <path d="M1650 330 L1770 450 L1650 570"/>
    <path d="M1600 310 L1540 590" stroke-width="8" opacity="0.8"/>
  </g>

  <!-- curly braces, subtle -->
  <g fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" opacity="0.22">
    <path d="M250 150 q-40 0 -40 40 v40 q0 30 -30 30 q30 0 30 30 v40 q0 40 40 40"/>
    <path d="M340 150 q40 0 40 40 v40 q0 30 30 30 q-30 0 -30 30 v40 q0 40 -40 40"/>
  </g>

  <!-- hexagon (Angular-ish shield) outlines -->
  <g fill="none" stroke="#ff4d6d" stroke-width="2" opacity="0.28">
    <path d="M1180 110 l70 25 l-12 90 l-58 32 l-58 -32 l-12 -90 z"/>
    <path d="M1180 140 l45 16 l-8 58 l-37 21 l-37 -21 l-8 -58 z" opacity="0.7"/>
  </g>

  <!-- diagonal light streaks -->
  <g stroke-linecap="round" fill="none">
    <path d="M-50 760 L900 -60" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    <path d="M200 1140 L1300 120" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M900 1140 L1980 180" stroke="#ff4d6d" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- sparkle dots -->
  <g filter="url(#soft)">
    <circle cx="140" cy="140" r="3" fill="#fff" opacity="0.7"/>
    <circle cx="520" cy="90" r="2" fill="#a78bfa" opacity="0.8"/>
    <circle cx="760" cy="230" r="3" fill="#ff4d6d" opacity="0.8"/>
    <circle cx="980" cy="120" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="1320" cy="780" r="3" fill="#22d3ee" opacity="0.8"/>
    <circle cx="1740" cy="860" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="1850" cy="140" r="3" fill="#a78bfa" opacity="0.8"/>
    <circle cx="420" cy="620" r="2" fill="#ff4d6d" opacity="0.7"/>
    <circle cx="90" cy="520" r="3" fill="#22d3ee" opacity="0.6"/>
    <circle cx="1020" cy="860" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="1560" cy="980" r="3" fill="#a78bfa" opacity="0.7"/>
    <circle cx="700" cy="1000" r="2" fill="#fff" opacity="0.5"/>
  </g>

  <!-- dark centre-left calm zone so the big name stays readable -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
